[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rem2"
version = "0.1.0"
description = "VenusREM2: training-free calibration for protein language models on variant effect prediction"
readme = "README.md"
license = "LicenseRef-VenusREM2-Academic"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Yang Tan", email = "ty_ang@163.com" }]
keywords = ["protein", "PLM", "variant-effect", "DMS", "VenusREM2", "VenusREM"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# Default install is the product: CLI scoring + local dashboard.
# Install a CUDA-matching PyTorch *before* this package so pip does not
# pull a CPU-only wheel. Backbone stacks (ProSST / S3F / CARP / ESM-3)
# stay opt-in extras and are pulled when that model is used.
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "tqdm>=4.65",
  "torch>=2.1",
  "transformers>=4.40",
  "huggingface-hub>=0.23",
  "joblib>=1.3",
  "safetensors>=0.4",
  "pyyaml>=6.0",
  "biopython>=1.80",
  "biotite>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# ProSST structure-token pipeline. Tokenizer weights download from
# tyang816/ProSST on first --model prosst / venusrem2 use.
prosst = [
  "torch-geometric>=2.4",
  "pathos>=0.3",
  "biotite>=0.40",
]
# PDB / inverse-folding helpers (ESM-IF, RSA, ProteinMPNN coordinate I/O).
structure = [
  "biotite>=0.40",
  "biopython>=1.80",
]
# Full S3F / S2F TorchDrug stack (large). Official torchdrug wheels only
# support Python <3.11; on 3.11+ install from source, e.g.:
#   bash script/install_s3f_deps.sh
# Inference with precomputed surface .pkl does NOT require pykeops.
# pykeops is only needed for on-the-fly surface generation from PDB.
s3f = [
  "torchdrug>=0.2.1; python_version < '3.11'",
  "torch-geometric>=2.4",
  "torch-scatter>=2.1",
  "torch-cluster>=1.6",
  "robust-laplacian>=0.2",
  "biopython>=1.80",
  "scikit-learn>=1.3",
]
# Optional: on-the-fly surface meshing for S3F (not required if using precomputed pkl).
s3f-surface-gen = [
  "pykeops>=2.1",
]
# CARP (Zenodo weights via sequence_models).
carp = [
  "sequence-models>=1.7",
]
# EvolutionaryScale ESM-3 / ESM-C package (separate from facebookresearch/esm).
esm3 = [
  "esm>=3.0",
  "httpx>=0.27",
]
# MSA / alignment utilities.
msa = [
  "biopython>=1.80",
]
# Aliases of the default install. [all] is CLI + dashboard only — not every backbone.
cli = [
  "biotite>=0.40",
]
recommended = [
  "biotite>=0.40",
]
dashboard = [
  "biotite>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]
all = [
  "biotite>=0.40",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]
# Common baseline set without S3F (S3F is opt-in due to TorchDrug weight).
baselines = [
  "torch-geometric>=2.4",
  "pathos>=0.3",
  "biotite>=0.40",
  "biopython>=1.80",
  "sequence-models>=1.7",
  "esm>=3.0",
]
dev = [
  "pytest>=7.0",
  "ruff>=0.4",
  "build>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/tyang816/VenusREM2"
Repository = "https://github.com/tyang816/VenusREM2"
Issues = "https://github.com/tyang816/VenusREM2/issues"
Changelog = "https://github.com/tyang816/VenusREM2/releases"

[project.scripts]
rem2 = "rem2.cli:main"
venusrem2 = "rem2.cli:main"
venusrem-score = "rem2.cli:main"
# Third-party packages register ModelAdapter subclasses here, e.g.:
#   my_plm = "mypkg.adapters:MyAdapter"
# Built-ins register via rem2.models.builtins on import.
[project.entry-points."rem2.models"]
[project.entry-points."venusrem2.models"]

[tool.setuptools]
# Do not auto-include leftover on-disk weights (ProSST static/*.joblib, AE.pt).
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["rem2*"]
exclude = ["rem2.legacy*"]

[tool.setuptools.package-data]
rem2 = [
  "baseline/protssn/protssn_config/**/*",
  "baseline/progen2/tokenizer.json",
  "baseline/progen3/tokenizer.json",
  "baseline/s2f/config/**/*",
  "examples/**/*",
  "dashboard/static/**/*",
  "dashboard/static/vendor/**/*",
]

[tool.setuptools.exclude-package-data]
rem2 = [
  "**/__pycache__/*",
  "**/*.py[cod]",
  "baseline/prosst/static/**",
  "**/*.joblib",
  "legacy/**",
]
